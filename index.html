<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16866b"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Мои тренировки</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f8;color:#1f2937}.card{max-width:440px;margin:20px;padding:28px;border-radius:22px;background:#fff;box-shadow:0 8px 32px #1f293710;text-align:center}h1{font-size:24px}p{color:#64748b;line-height:1.5;overflow-wrap:anywhere}.spin{width:26px;height:26px;border:3px solid #dce8e4;border-top-color:#16a085;border-radius:50%;animation:s .8s linear infinite;margin:18px auto}@keyframes s{to{transform:rotate(360deg)}}button{background:#16a085;color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:700}
</style></head><body><main class="card"><h1>Мои тренировки</h1><p id="msg">Подготовка загрузки…</p><div class="spin" id="spin"></div><button id="retry" hidden>Повторить загрузку</button></main>
<script>
(async()=>{
 const KEY='my-workouts-html-gzip-base64-v1.1.0';
 const parts=["./payload/part-00.txt","./payload/part-01.txt","./payload/part-02.txt","./payload/part-03.txt","./payload/part-04.txt","./payload/part-05.txt","./payload/part-06.txt","./payload/part-07.txt","./payload/part-08.txt","./payload/part-09.txt","./payload/part-10a.txt","./payload/part-10b.txt","./payload/part-11.txt","./payload/part-12.txt","./payload/part-13.txt"];
 const msg=document.getElementById('msg'),spin=document.getElementById('spin'),retry=document.getElementById('retry');
 async function load(){
   let encoded='';
   try{
     let completed=0;
     const pieces=await Promise.all(parts.map(async url=>{
       const controller=new AbortController();
       const timeout=setTimeout(()=>controller.abort(),20000);
       try{
         const response=await fetch(url,{cache:'no-store',signal:controller.signal});
         if(!response.ok)throw new Error('HTTP '+response.status+' при загрузке '+url.split('/').pop());
         const piece=(await response.text()).trim();
         if(!piece)throw new Error('Пустой файл '+url.split('/').pop());
         completed++;msg.textContent='Загружаю приложение: '+completed+' из '+parts.length+' частей…';
         return piece;
       } finally {clearTimeout(timeout);}
     }));
     encoded=pieces.join('');
     try{localStorage.setItem(KEY,encoded)}catch(storageError){}
   }catch(err){
     try{encoded=localStorage.getItem(KEY)||''}catch(storageError){}
     if(!encoded)throw new Error(err?.name==='AbortError'?'Сервер долго не отвечает. Попробуйте другую сеть или повторите загрузку.':(err?.message||'Не удалось скачать файлы приложения.'));
   }
   msg.textContent='Распаковываю приложение…';
   const binary=atob(encoded),bytes=new Uint8Array(binary.length);
   for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
   if(!('DecompressionStream' in window))throw new Error('Этот браузер не поддерживает распаковку приложения. Откройте ссылку в Chrome.');
   const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
   let html=await new Response(stream).text();
   if(!/<!doctype html>/i.test(html)||!html.includes('my-workouts-db'))throw new Error('Проверка файлов не пройдена. Нажмите «Повторить загрузку».');
   html=html.replace(/<head([^>]*)>/i,'<head$1>\n<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><meta name="theme-color" content="#16866b">');
   if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
   document.open();document.write(html);document.close();
 }
 try{await load()}catch(e){msg.textContent='Не удалось загрузить приложение. '+(e?.message||'Проверьте интернет и повторите попытку.');spin.hidden=true;retry.hidden=false;}
 retry.addEventListener('click',()=>location.reload());
})();
</script></body></html>
