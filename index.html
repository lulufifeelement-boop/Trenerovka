<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a1014">
  <meta name="description" content="Персональный тренировочный план A/B, таймер отдыха и дневник прогресса.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Форма — тренировочный план</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;background:#0a1014;color:#eef3f0}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}
    .loader{width:min(100%,440px);padding:28px;border:1px solid #29363a;border-radius:24px;background:#111b20;text-align:center}
    h1{font-size:23px;margin:0 0 10px;letter-spacing:.06em}p{color:#9eaeaa;line-height:1.55;overflow-wrap:anywhere}
    .spin{width:28px;height:28px;border:3px solid #354449;border-top-color:#c8f36a;border-radius:50%;animation:spin .8s linear infinite;margin:22px auto}
    @keyframes spin{to{transform:rotate(360deg)}}button{background:#c8f36a;color:#0a1014;border:0;border-radius:12px;padding:12px 18px;font-weight:750}button[hidden],.spin[hidden]{display:none}
  </style>
</head>
<body>
  <main class="loader">
    <h1>ФОРМА</h1>
    <p id="message">Подготовка приложения…</p>
    <div class="spin" id="spinner" aria-hidden="true"></div>
    <button id="retry" type="button" hidden>Повторить загрузку</button>
  </main>
<script>
(() => {
  'use strict';
  const KEY = 'forma-workout-bundle-2.0.0-becedc9597';
  const EXPECTED_SHA256 = '5d91c3f918d685463b737b7c8cf293b684f8802a8db2c5899e676f281eda5aea';
  const PARTS = [
    'part-00.txt','part-01.txt','part-02.txt','part-03.txt','part-04.txt',
    'part-05.txt','part-06.txt','part-07.txt','part-08.txt'
  ].map(name => './payload/' + name);
  const message = document.getElementById('message');
  const spinner = document.getElementById('spinner');
  const retry = document.getElementById('retry');

  async function fetchBundle() {
    let done = 0;
    const pieces = await Promise.all(PARTS.map(async (url) => {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 20000);
      try {
        const response = await fetch(url, { cache: 'no-store', signal: controller.signal });
        if (!response.ok) throw new Error('HTTP ' + response.status + ': ' + url.split('/').pop());
        const part = (await response.text()).trim();
        if (!part) throw new Error('Пустая часть ' + url.split('/').pop());
        done += 1;
        message.textContent = 'Загружаю приложение: ' + done + ' из ' + PARTS.length + '…';
        return part;
      } finally { clearTimeout(timeout); }
    }));
    return pieces.join('');
  }

  async function decodeBundle(encoded) {
    const binary = atob(encoded);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
    if (!('DecompressionStream' in window)) throw new Error('Откройте приложение в актуальном Chrome.');
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html = await new Response(stream).text();
    if (!/^\s*<!doctype html>/i.test(html) || !html.includes('forma-workout-app-v1')) {
      throw new Error('Проверка содержимого не пройдена.');
    }
    if (window.crypto && window.crypto.subtle) {
      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(html));
      const actual = Array.from(new Uint8Array(digest), b => b.toString(16).padStart(2, '0')).join('');
      if (actual !== EXPECTED_SHA256) throw new Error('Контрольная сумма приложения не совпала.');
    }
    return html;
  }

  async function start() {
    let encoded = '';
    try {
      encoded = await fetchBundle();
      try { localStorage.setItem(KEY, encoded); } catch (_) {}
    } catch (networkError) {
      try { encoded = localStorage.getItem(KEY) || ''; } catch (_) {}
      if (!encoded) {
        const detail = networkError.name === 'AbortError' ? 'Сервер долго не отвечает.' : networkError.message;
        throw new Error(detail + ' Проверьте интернет и повторите загрузку.');
      }
      message.textContent = 'Запускаю сохранённую офлайн-версию…';
    }
    message.textContent = 'Распаковываю приложение…';
    const html = await decodeBundle(encoded);
    const appHtml = html.replace(/<head([^>]*)>/i, '<head$1>\n<link rel="manifest" href="./manifest.webmanifest">');
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
    document.open();
    document.write(appHtml);
    document.close();
  }

  start().catch((error) => {
    message.textContent = 'Не удалось запустить «Форму». ' + (error && error.message ? error.message : 'Повторите попытку.');
    spinner.hidden = true;
    retry.hidden = false;
  });
  retry.addEventListener('click', () => location.reload());
})();
</script>
</body>
</html>
