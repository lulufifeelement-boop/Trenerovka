<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6f8"><title>Мои тренировки</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f8;color:#1f2937}.card{max-width:440px;margin:20px;padding:28px;border-radius:22px;background:#fff;box-shadow:0 8px 32px #1f293710;text-align:center}h1{font-size:24px}p{color:#64748b;line-height:1.5}.spin{width:26px;height:26px;border:3px solid #dce8e4;border-top-color:#16a085;border-radius:50%;animation:s .8s linear infinite;margin:18px auto}@keyframes s{to{transform:rotate(360deg)}}button{background:#16a085;color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:700}
</style></head><body><main class="card"><h1>Мои тренировки</h1><p id="msg">Загружаю приложение и 23 векторные схемы…</p><div class="spin" id="spin"></div><button id="retry" hidden>Повторить загрузку</button></main>
<script>
(async()=>{
 const KEY='my-workouts-html-gzip-base64-v1.1.0';
 const parts=["./payload/part-00.txt","./payload/part-01.txt","./payload/part-02.txt","./payload/part-03.txt","./payload/part-04.txt","./payload/part-05.txt","./payload/part-06.txt","./payload/part-07.txt","./payload/part-08.txt","./payload/part-09.txt"];
 const msg=document.getElementById('msg'),spin=document.getElementById('spin'),retry=document.getElementById('retry');
 async function load(){
   let encoded='';
   try{
     const pieces=await Promise.all(parts.map(async url=>{const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw new Error('Не удалось загрузить '+url);return (await response.text()).trim();}));
     encoded=pieces.join('');
     localStorage.setItem(KEY,encoded);
   }catch(err){
     encoded=localStorage.getItem(KEY)||'';
     if(!encoded)throw err;
   }
   const binary=atob(encoded),bytes=new Uint8Array(binary.length);
   for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
   if(!('DecompressionStream' in window))throw new Error('Нужен актуальный Chrome с поддержкой распаковки gzip.');
   const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
   const html=await new Response(stream).text();
   if(!/<!doctype html>/i.test(html)||!html.includes('my-workouts-db'))throw new Error('Проверка загруженного приложения не пройдена.');
   document.open();document.write(html);document.close();
 }
 try{await load()}catch(e){msg.textContent='Не удалось загрузить приложение. Проверьте подключение к интернету и откройте страницу снова. '+(e?.message||'');spin.hidden=true;retry.hidden=false;}
 retry.addEventListener('click',()=>location.reload());
})();
</script></body></html>
