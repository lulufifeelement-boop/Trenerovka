name: Publish Forma to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify application bundle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          names = [f"payload/part-{i:02}.txt" for i in range(9)]
          encoded = "".join(Path(name).read_text().strip() for name in names)
          html = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(html).hexdigest()
          expected = "5d91c3f918d685463b737b7c8cf293b684f8802a8db2c5899e676f281eda5aea"
          if digest != expected:
              raise SystemExit(f"Bundle checksum mismatch: {digest}")
          if b"forma-workout-app-v1" not in html:
              raise SystemExit("Forma app marker is missing")
          print(f"Verified Forma HTML: {digest}; size: {len(html)} bytes")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: create

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
