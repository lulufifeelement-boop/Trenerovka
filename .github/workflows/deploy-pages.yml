name: Publish My Workouts to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify bundled application
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          names = [
            "payload/part-00.txt",
  "payload/part-01.txt",
  "payload/part-02.txt",
  "payload/part-03.txt",
  "payload/part-04.txt",
  "payload/part-05.txt",
  "payload/part-06.txt",
  "payload/part-07.txt",
  "payload/part-08.txt",
  "payload/part-09.txt",
            "payload/part-10a.txt",
            "payload/part-10b.txt",
            "payload/part-11.txt",
            "payload/part-12.txt",
            "payload/part-13.txt",
          ]
          encoded = "".join(Path(name).read_text().strip() for name in names)
          data = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(data).hexdigest()
          expected = "a676439723abfa9f0ae630d5f81ba350ff2534cdfe6f330feb946ad214ff9ae8"
          if digest != expected:
              raise SystemExit(f"Bundle checksum mismatch: {digest}")
          print(f"Verified app HTML SHA-256: {digest}; size: {len(data)} bytes")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: create

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
